<!DOCTYPE html>
<html lang="en"><head><script>if(localStorage.getItem('am_dashboard_access')!=='granted'){location.replace('index.html');}</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AM Volume — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f3f1fa;--card:#fff;--tx:#241f3a;--mu:#7a7494;--bd:#e4e0f2;--ac:#6d28d9;--ok:#059669;--warn:#d97706;--bad:#e11d48;--hd:#ede9fe;--heat:109,40,217}
@media(prefers-color-scheme:dark){:root{--bg:#15121f;--card:#201b30;--tx:#ece9f7;--mu:#9a94b5;--bd:#322b49;--ac:#a78bfa;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--hd:#2a2340;--heat:167,139,250}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0;color:var(--ac);letter-spacing:.2px}.sub{color:var(--mu);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=month],button{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.pri:hover{filter:brightness(1.1)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.k,.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(60,40,120,.08)}
.k .l{color:var(--mu);font-size:12px}.k .v{font-size:24px;font-weight:600;margin-top:2px}.k .s{font-size:12px;color:var(--mu)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.card h2{font-size:14px;margin:0 0 8px}.ch{position:relative;height:260px}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:8px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:5px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--bd);background:var(--card)}
th{position:sticky;top:0;background:var(--hd);z-index:2;color:var(--ac);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.4px}
td:first-child,th:first-child{position:sticky;left:0;text-align:left;z-index:1;border-right:1px solid var(--bd)}th:first-child{z-index:3}
tr.tot td{font-weight:600;background:var(--hd)}
.ach{position:relative;min-width:110px;height:22px;border-radius:11px;background:var(--hd);overflow:hidden;text-align:right}.ach i{position:absolute;left:0;top:0;bottom:0;opacity:.28}.ach b{position:relative;display:block;line-height:22px;padding-right:10px;font-size:12px}th.rv{background:color-mix(in srgb,#0d9488 32%,var(--card));color:var(--tx)}td.rv{background:color-mix(in srgb,#14b8a6 16%,var(--card));font-weight:600}tr.tot td.rv{background:color-mix(in srgb,#14b8a6 28%,var(--card))}th.rc{background:color-mix(in srgb,#f59e0b 34%,var(--card));color:var(--tx)}td.rc{background:color-mix(in srgb,#f59e0b 15%,var(--card));font-weight:600}tr.tot td.rc{background:color-mix(in srgb,#f59e0b 28%,var(--card))}.up button.rs{color:var(--bad);border-color:var(--bd);background:transparent}.pill{padding:2px 7px;border-radius:10px;font-weight:600;color:#fff;font-size:12px}
.bar2{height:5px;background:var(--bd);border-radius:3px;min-width:60px;margin-top:3px}.bar2 i{display:block;height:100%;border-radius:3px}
#msg{font-size:12px;color:var(--mu);margin:6px 0;min-height:16px}
.ups{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}.up{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:4px 8px}.up button{padding:3px 9px;font-size:12px}.up .sub{font-size:11px;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}tr.sel td{background:var(--hd)}td.am{cursor:pointer;font-weight:600}tr.sl td:first-child{padding-left:24px;color:var(--mu);font-weight:400}.drop{border:2px dashed var(--bd);border-radius:10px;padding:10px;text-align:center;color:var(--mu);margin-bottom:12px}.drop.on{border-color:var(--ac)}
.part{font-style:italic;color:var(--warn)}
</style></head><body><nav id="tabs" style="display:flex;gap:4px;padding:8px 16px 0;max-width:1500px;margin:0 auto;font:600 14px system-ui,sans-serif">
<a href="index.html" style="padding:8px 16px;border-radius:8px 8px 0 0;text-decoration:none;color:var(--mu);background:var(--hd)">Ticket Performance</a>
<a href="volume.html" style="padding:8px 16px;border-radius:8px 8px 0 0;text-decoration:none;color:#fff;background:var(--ac)">AM Volume</a></nav>
<div class="wrap">
<header>
 <div><h1>AM Volume Dashboard</h1><div class="sub" id="cyc"></div></div>
 <div class="bar">
  <select id="cycle" title="Cycle (26th–25th)"></select>
  <select id="through" title="Data through"></select>
  <select id="sort" title="Sort AMs"><option value="az">Sort: AM A → Z</option><option value="za">AM Z → A</option><option value="vh">Achieved high → low</option><option value="vl">Achieved low → high</option><option value="ph">Ach % high → low</option><option value="pl">Ach % low → high</option></select>
  <select id="type"><option value="F">Forward</option><option value="R">Reverse</option><option value="A">All</option></select>
  <select id="attr"><option value="mapfb">AM: Mapping → fallback data</option><option value="map">AM: Mapping only</option><option value="data">AM: Data amEmail</option></select>
  <input id="seller" list="sl" placeholder="Filter seller email…" style="padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);width:220px"><datalist id="sl"></datalist>
  <button onclick="expandAll()" id="exp">Expand all</button>
  <button onclick="exportCsv()">Export CSV</button>
  <button onclick="resetAll()" title="Clear saved data">Reset</button>
 </div>
</header>
<div class="ups">
 <div class="up"><button class="pri" onclick="pick('data')">Daily shipment file</button><div class="sub" id="st-data"></div><button class="rs" title="Reset this upload" onclick="resetKind('data')">✕ Reset</button></div>
 <div class="up"><button class="pri" onclick="pick('target')">Monthly target file</button><div class="sub" id="st-target"></div><button class="rs" title="Reset this upload" onclick="resetKind('target')">✕ Reset</button></div>
 <div class="up"><button class="pri" onclick="pick('rev')">Revenue report</button><div class="sub" id="st-rev"></div><button class="rs" title="Reset this upload" onclick="resetKind('rev')">✕ Reset</button></div>
 <div class="up"><button class="pri" onclick="pick('map')">Seller → AM mapping</button><div class="sub" id="st-map"></div><button class="rs" title="Reset this upload" onclick="resetKind('map')">✕ Reset</button></div>
 <div class="up"><span class="sub" title="Target/mapping apply to this cycle; blank = auto">Apply to cycle</span><input type="month" id="applyCycle" style="padding:2px 6px;font-size:12px"></div>
</div>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
<div id="msg"></div>
<div class="card"><h2>AM × day pickup volume <span class="sub">(click AM to see seller-wise count · target = DRR × days in cycle)</span></h2><div class="tw"><table id="tbl"></table></div></div>
</div>
<script>
const SEED0=/*SEED*/null;
const SEED=SEED0&&Object.assign(SEED0,{meta:{}});
const $=s=>document.querySelector(s),KEY='am_dash_v3';
let S={agg:[],rev:[],targets:{},mapping:{}},last=null;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
if(!S.agg.length&&SEED)S=SEED;S.meta=S.meta||{};S.rev=S.rev||[];for(const k in S.meta)if(/^Seeded/.test(S.meta[k]))delete S.meta[k];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){msg('Loaded, but browser storage unavailable — data will not persist after closing.')}};
const msg=t=>$('#msg').textContent=t;
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const pad=n=>String(n).padStart(2,'0'),nm=e=>(e||'').split('@')[0];
const norm=e=>String(e||'').trim().toLowerCase();
function cycleKey(ds){let y=+ds.slice(0,4),m=+ds.slice(5,7),d=+ds.slice(8,10);if(d>=26){m++;if(m>12){m=1;y++}}return y+'-'+pad(m)}
function cycleDays(key){const[y,m]=key.split('-').map(Number);const out=[];let d=new Date(Date.UTC(y,m-2,26));const e=Date.UTC(y,m-1,25);
 while(d.getTime()<=e){out.push(d.toISOString().slice(0,10));d=new Date(d.getTime()+864e5)}return out}
const cycLabel=k=>{const d=cycleDays(k);const f=s=>new Date(s+'T00:00:00Z').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'UTC'});return f(d[0])+' – '+f(d[d.length-1])};
function toDate(v){if(v==null||v==='')return null;let d;
 if(v instanceof Date)d=new Date(v.getTime()+432e5);
 else if(typeof v==='number')d=new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5);
 else{const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];
  m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return m[3]+'-'+pad(m[2])+'-'+pad(m[1]);return null}
 return v instanceof Date?d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()):d.toISOString().slice(0,10)}
function resolver(key,mode){
 const ks=Object.keys(S.mapping).sort();let use=S.mapping[key]?key:[...ks].reverse().find(k=>k<=key)||ks[ks.length-1];
 const mp=S.mapping[use]||{};
 return(seller,dataAm)=>{const m=mp[norm(seller)];
  if(mode==='data')return norm(dataAm)||'unmapped';
  if(m)return norm(m.am);
  return mode==='mapfb'&&dataAm?norm(dataAm):'unmapped'}}
const LOOK={};
const idb=()=>new Promise((res,rej)=>{try{const q=indexedDB.open('am_dash',1);q.onupgradeneeded=()=>q.result.createObjectStore('ship');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}});
async function lookPut(map){Object.assign(LOOK,map);try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction('ship','readwrite'),s=tx.objectStore('ship');for(const k in map)s.put(map[k],k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function lookGet(ids){const out={},miss=[];for(const i of ids){if(LOOK[i]!==undefined)out[i]=LOOK[i];else miss.push(i)}
 if(miss.length)try{const db=await idb(),s=db.transaction('ship').objectStore('ship');
  await Promise.all(miss.map(i=>new Promise(res=>{const q=s.get(i);q.onsuccess=()=>{if(q.result)out[i]=q.result;res()};q.onerror=()=>res()})))}catch(e){}
 return out}
const EXP=new Set();let kind='data';
function pick(k){kind=k;$('#file').click()}
function expandAll(){if(!last)return;const all=last.list.map(r=>r.a);if(EXP.size<all.length)all.forEach(a=>EXP.add(a));else EXP.clear();render()}
$('#tbl').onclick=e=>{const c=e.target.closest('td.am');if(!c)return;const a=c.dataset.a;EXP.has(a)?EXP.delete(a):EXP.add(a);render()};
const SORT={az:(x,y)=>x.a.localeCompare(y.a),za:(x,y)=>y.a.localeCompare(x.a),vh:(x,y)=>y.tot-x.tot,vl:(x,y)=>x.tot-y.tot,
 ph:(x,y)=>(y.pct??-1)-(x.pct??-1),pl:(x,y)=>(x.pct??1e9)-(y.pct??1e9)};
function render(){
 for(const k of['data','target','map','rev']){const e=$('#st-'+k),v=S.meta&&S.meta[k];e.textContent=v||'';e.title=v||''};
 const keys=[...new Set(S.agg.map(r=>cycleKey(r[0])))].sort().reverse();
 const sel=$('#cycle');const cur=sel.value&&keys.includes(sel.value)?sel.value:keys[0];
 sel.innerHTML=keys.map(k=>`<option value="${k}">${cycLabel(k)}</option>`).join('');
 if(!keys.length){$('#tbl').innerHTML='';msg('No data. Upload the daily shipment file.');return}
 sel.value=cur;const days=cycleDays(cur);
 const have=[...new Set(S.agg.filter(r=>cycleKey(r[0])===cur).map(r=>r[0]))].sort();
 const th=$('#through');const prev=th.value;
 th.innerHTML=have.map(d=>`<option>${d}</option>`).join('');
 th.value=have.includes(prev)?prev:have[have.length-1];
 const thr=th.value,type=$('#type').value,res=resolver(cur,$('#attr').value),sf=norm($('#seller').value);
 const rows={},sellers=new Set();
 for(const[d,sl,am,t,c]of S.agg){if(cycleKey(d)!==cur||d>thr)continue;if(type!=='A'&&t!==type)continue;
  sellers.add(sl);if(sf&&!sl.includes(sf))continue;
  const a=res(sl,am),r=(rows[a]??={days:{},tot:0,ra:0,ids:0,sellers:{}});r.days[d]=(r.days[d]||0)+c;r.tot+=c;
  const s=(r.sellers[sl||'(blank)']??={days:{},tot:0,ra:0,ids:0});s.days[d]=(s.days[d]||0)+c;s.tot+=c}
 for(const[d,sl,am,n,v]of S.rev){if(cycleKey(d)!==cur||d>thr)continue;if(sf&&!sl.includes(sf))continue;
  const a=res(sl,am),r=(rows[a]??={days:{},tot:0,ra:0,ids:0,sellers:{}});r.ra+=v;r.ids+=n;
  const s=(r.sellers[sl||'(blank)']??={days:{},tot:0,ra:0,ids:0});s.ra+=v;s.ids+=n}
 $('#sl').innerHTML=[...sellers].sort().map(s=>`<option value="${s}">`).join('');
 const tg=S.targets[cur]||{};
 if(!sf)Object.keys(tg).forEach(a=>{rows[a]??={days:{},tot:0,ra:0,ids:0,sellers:{}}});
 const N=days.length,el=days.filter(d=>d<=thr).length,left=N-el;
 const list=Object.entries(rows).map(([a,r])=>{const t=tg[a],tv=t?t.drr*N:null;
  return{a,...r,tv,rev:t?.rev,pct:tv&&!sf?r.tot/tv*100:null,rpct:t?.rev&&!sf?r.ra/t.rev*100:null,req:tv&&left&&!sf?Math.max(0,(tv-r.tot)/left):null,drr:r.tot/el}}).sort(SORT[$('#sort').value]);
 last={cur,days,thr,list};
 $('#cyc').textContent=`Cycle ${cycLabel(cur)} · ${N} days · through ${thr} (day ${el}, ${left} left)`;
 $('#exp').textContent=EXP.size<list.length?'Expand all':'Collapse all';
 const f=n=>Math.round(n).toLocaleString('en-IN');
 const col=p=>p==null?'var(--mu)':p>=el/N*100?'var(--ok)':p>=el/N*100*.8?'var(--warn)':'var(--bad)';
 let mx=1;list.forEach(r=>days.forEach(d=>mx=Math.max(mx,r.days[d]||0)));
 const cells=(r,heat)=>days.map(d=>{const v=r.days[d];return d>thr||v==null?`<td style="color:var(--mu)">·</td>`:`<td ${heat?`style="background:rgba(var(--heat),${(v/mx*.55).toFixed(2)})"`:''}>${f(v)}</td>`}).join('');
 let h=`<thead><tr><th>AM / Seller</th><th>Target</th><th>Achieved</th><th>Ach %</th><th>Avg/day</th><th>Req DRR</th><th class="rv">Rev target (₹)</th><th class="rv" title="Revenue target ÷ target volume (DRR × days)">Rev / shipment (₹)</th><th class="rc" title="Σ net_revenue by pickup date">Revenue (₹)</th><th class="rc">Tracking IDs</th><th class="rc">Rev Ach %</th>${days.map(d=>`<th>${d.slice(8)}/${d.slice(5,7)}</th>`).join('')}</tr></thead><tbody>`;
 for(const r of list){const open=EXP.has(r.a),ns=Object.keys(r.sellers).length;
  h+=`<tr><td class="am" data-a="${r.a}">${open?'▾':'▸'} ${nm(r.a)} <span class="sub">(${ns})</span></td><td>${r.tv?f(r.tv):'—'}</td><td><b>${f(r.tot)}</b></td><td>${r.pct==null?'—':`<div class="ach"><i style="width:${Math.min(100,r.pct)}%;background:${col(r.pct)}"></i><b style="color:${col(r.pct)}">${r.pct.toFixed(1)}%</b></div>`}</td><td>${f(r.drr)}</td><td>${r.req==null?'—':f(r.req)}</td><td class="rv">${r.rev?f(r.rev):'—'}</td><td class="rv">${r.rev&&r.tv?(r.rev/r.tv).toFixed(1):'—'}</td><td class="rc">${f(r.ra)}</td><td class="rc">${f(r.ids)}</td><td class="rc">${r.rpct==null?'—':r.rpct.toFixed(1)+'%'}</td>${cells(r,1)}</tr>`;
  if(open)for(const[s,v]of Object.entries(r.sellers).sort((x,y)=>y[1].tot-x[1].tot))
   h+=`<tr class="sl"><td>${s}</td><td></td><td>${f(v.tot)}</td><td>${(v.tot/r.tot*100).toFixed(1)}%</td><td>${f(v.tot/el)}</td><td></td><td></td><td></td><td class="rc">${f(v.ra)}</td><td class="rc">${f(v.ids)}</td><td class="rc"></td>${cells(v,0)}</tr>`}
 const T=list.reduce((s,r)=>s+r.tot,0),TT=sf?0:list.reduce((s,r)=>s+(r.tv||0),0);
 h+=`<tr class="tot"><td>Total</td><td>${TT?f(TT):'—'}</td><td>${f(T)}</td><td>${TT?(T/TT*100).toFixed(1)+'%':'—'}</td><td>${f(T/el)}</td><td>${TT&&left?f(Math.max(0,(TT-T)/left)):'—'}</td><td class="rv">${f(list.reduce((s,r)=>s+(r.rev||0),0))}</td><td class="rv">${TT?(list.reduce((s,r)=>s+(r.rev||0),0)/TT).toFixed(1):'—'}</td>`
  +`<td class="rc">${f(list.reduce((s,r)=>s+r.ra,0))}</td><td class="rc">${f(list.reduce((s,r)=>s+r.ids,0))}</td><td class="rc">${TT?(list.reduce((s,r)=>s+r.ra,0)/list.reduce((s,r)=>s+(r.rev||0),0)*100).toFixed(1)+'%':'—'}</td>`
  +days.map(d=>d>thr?'<td>·</td>':`<td>${f(list.reduce((s,r)=>s+(r.days[d]||0),0))}</td>`).join('')+'</tr></tbody>';
 $('#tbl').innerHTML=h;
 msg('');
}
async function ingest(files,kind){
 const notes=[];S.meta=S.meta||{};
 for(const f of files){msg('Reading '+f.name+' …');await new Promise(r=>setTimeout(r,30));
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true,dense:true});let hit=false;
  for(const name of wb.SheetNames){
   const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:null});if(!rows.length)continue;
   const hd=Object.keys(rows[0]).map(h=>h.trim().toLowerCase());const H=k=>Object.keys(rows[0]).find(h=>h.trim().toLowerCase()===k);
   const latestKey=S.agg.length?cycleKey(S.agg.map(r=>r[0]).sort().pop()):null;
   const ac=$('#applyCycle').value,now=new Date().toLocaleString('en-GB');
   if(kind==='data'&&hd.includes('shipment_id')&&hd.includes('pickup_date')){
    const ag={},dts=new Set();let minM='9999',used=0;
    for(const r of rows){const m=toDate(r.manifested_date);if(m&&m<minM)minM=m}
    const lk={};
    for(const r of rows){const d=toDate(r.pickup_date);if(!d)continue;used++;dts.add(d);lk[String(r.shipment_id).trim()]=norm(r.seller_email)+'|'+norm(r.amEmail);
     const t=String(r.shipment_type||'').toUpperCase().startsWith('R')?'R':'F';
     const k=d+'|'+norm(r.seller_email)+'|'+norm(r.amEmail)+'|'+t;ag[k]=(ag[k]||0)+1}
    // pickup dates before the file's earliest manifest date are incomplete: keep stored data for them
    const have=new Set(S.agg.map(r=>r[0])),rd=new Set([...dts].filter(d=>d>=minM||!have.has(d)));
    S.agg=S.agg.filter(r=>!rd.has(r[0]));
    for(const k in ag){const[d,s,a,t]=k.split('|');if(rd.has(d))S.agg.push([d,s,a,t,ag[k]])}
    await lookPut(lk);const ds=[...dts].sort();S.meta.data=`${f.name}: ${used.toLocaleString()} picked-up rows, ${ds[0]} → ${ds[ds.length-1]} (${now})`;hit=true;break;
   }else if(kind==='rev'&&hd.includes('tracking_id')&&hd.includes('net_revenue')){
    const ids=rows.map(r=>String(r.tracking_id).trim()),L=await lookGet(ids);let mt=0;const ag={},dts=new Set();
    rows.forEach((r,i)=>{const d=toDate(r.pickup_date)||toDate(r.creation_date);if(!d)return;dts.add(d);
     const l=L[ids[i]];if(l)mt++;const[s,a]=l?l.split('|'):['',''];
     const k=d+'|'+s+'|'+a,o=(ag[k]??={n:0,v:0});o.n++;o.v+=+r.net_revenue||0});
    S.rev=S.rev.filter(r=>!dts.has(r[0]));
    for(const k in ag){const[d,s,a]=k.split('|');S.rev.push([d,s,a,ag[k].n,ag[k].v])}
    const ds=[...dts].sort();S.meta.rev=`${f.name}: ${rows.length.toLocaleString()} IDs, ${mt.toLocaleString()} matched to AM, ${ds[0]} → ${ds[ds.length-1]} (${now})`;hit=true;break;
   }else if(kind==='target'&&hd.includes('drr')){
    const nk=H('am name')||Object.keys(rows[0])[0],rk=Object.keys(rows[0]).find(h=>/target/i.test(h)),dk=H('drr');
    const mm=rk&&rk.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\w*/i);
    let key=ac;if(!key){const ref=latestKey||new Date().toISOString().slice(0,7);let y=+ref.slice(0,4);const m=mm?MON.indexOf(mm[1].toUpperCase())+1:+ref.slice(5);
     if(m-(+ref.slice(5))>6)y--;key=y+'-'+pad(m)}
    const t={};for(const r of rows){const a=norm(r[nk]);if(!a||a.includes('grand total'))continue;t[a]={drr:+r[dk]||0,rev:rk?+r[rk]||0:0}}
    S.targets[key]=t;S.meta.target=`${f.name}: ${Object.keys(t).length} AMs → ${cycLabel(key)} (${now})`;hit=true;break;
   }else if(kind==='map'&&hd.includes('seller email')&&hd.includes('am')){
    const key=ac||$('#cycle').value||latestKey;const mp={};
    for(const r of rows){const s=norm(r[H('seller email')]);if(s)mp[s]={am:norm(r[H('am')]),kam:r[H('kam')]||''}}
    S.mapping[key]=mp;S.meta.map=`${f.name}: ${Object.keys(mp).length} sellers → ${cycLabel(key)} (${now})`;hit=true;break;
   }}
  notes.push(hit?'Loaded '+f.name:`${f.name}: no sheet matches the ${kind} format`)}
 save();render();msg(notes.join(' · '))}
$('#file').onchange=e=>{ingest([...e.target.files],kind);e.target.value=''};
['cycle','through','type','attr','sort'].forEach(i=>$('#'+i).onchange=render);
$('#seller').oninput=render;
function exportCsv(){if(!last)return;const{days,list}=last;
 const q=[['AM','Target','Achieved','Ach%','Req DRR',...days],...list.map(r=>[r.a,r.tv??'',r.tot,r.pct?.toFixed(1)??'',r.req?.toFixed(0)??'',...days.map(d=>r.days[d]??'')])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([q.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));a.download='am_volume_'+last.cur+'.csv';a.click()}
async function lookClear(){for(const k in LOOK)delete LOOK[k];try{const db=await idb();db.transaction('ship','readwrite').objectStore('ship').clear()}catch(e){}}
async function resetKind(k){
 const cyc=$('#cycle').value,nmz={data:'all daily shipment data',rev:'all revenue data',target:'targets for '+(cyc?cycLabel(cyc):'all cycles'),map:'seller mapping for '+(cyc?cycLabel(cyc):'all cycles')};
 if(!confirm('Reset '+nmz[k]+'?'))return;
 if(k==='data'){S.agg=[];await lookClear()}
 else if(k==='rev')S.rev=[];
 else if(k==='target'){cyc?delete S.targets[cyc]:S.targets={}}
 else if(k==='map'){cyc?delete S.mapping[cyc]:S.mapping={}}
 delete S.meta[k];save();render();msg('Reset: '+nmz[k])}
function resetAll(){if(confirm('Clear all saved data?')){S={agg:[],rev:[],targets:{},mapping:{},meta:{}};lookClear();try{localStorage.removeItem(KEY)}catch(e){}render()}}
render();
</script></body></html>
